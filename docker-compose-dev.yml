version: '3.8'

networks:
  flask_middleware_net:
    name: flask_middleware_net
    driver: bridge

services:
  backend:
    image: flask-middleware:${ENVIRONMENT:-development}
    build: ./backend
    container_name: flask-middleware-dev
    restart: unless-stopped
    ports:
      - "${PORT}:5000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./backend:/backend
    command: > 
      bash -c "flask run --debug -p 5000 --host=${HOST};"
    networks:
      - flask_middleware_net